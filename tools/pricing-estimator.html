<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>SoFlo Estimator + Leads (internal)</title>
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700;800;900&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config={theme:{extend:{
  colors:{navy:'#182B3F',navy2:'#223A52',sand:'#F4ECD8',sand2:'#EADFC4',aqua:'#9ACAD6',aqualt:'#E2EEEF',
    aquaink:'#236473',sun:'#E7C25B',sundk:'#D4A93E',coral:'#BA4A30',coraldk:'#9E3C25',
    ok:'#2E7D5B',bad:'#B23B3B',line:'rgba(24,43,63,.14)'},
  fontFamily:{display:['Jost','ui-sans-serif','sans-serif'],body:['Barlow','ui-sans-serif','sans-serif']}
}}}
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.4/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>body{font-family:'Barlow',sans-serif;background:#F4ECD8}.font-display{font-family:'Jost',sans-serif}dialog::backdrop{background:rgba(24,43,63,.45)}</style>
</head>
<body class="text-navy">
<div id="root" class="max-w-5xl mx-auto px-4 pt-6 pb-24"></div>

<script type="text/babel" data-presets="react">
const {useState,useEffect,useRef}=React;

/* ===== constants + config ===== */
const LS='soflo_leads_v1',LS_URL='soflo_sheet_url',LS_PRICE='soflo_pricing',LS_TMPL='soflo_tmpl';
const DEF_SHEET='https://script.google.com/macros/s/AKfycbz3ZdK_OlRdHWjsGmSIh-L5EW-JemAcLsoSDLmSb8DWM7EwKSp_LjfBsUhElnn6c2nZ/exec';
const DEF_TMPL="Hi {name}, thanks for reaching out to SoFlo UnderPressure.\n\nYour estimate for {surfaces}: {range}.\nThat's a flat price we lock in after a quick look at the property or a couple of photos. No hourly, no surprises on the invoice.\n\nWant to grab a day this week? Reply here or call (305) 894-6336.\n- Saul, SoFlo UnderPressure";
const DEF_PRICING={driveway:149,walkway:99,patio:179,fence:149,house:299,roof:399,screen:149,oil:50,rust:65,gutter:95,min:175,tile:1.1,twostory:1.2,nowater:50,tight:1.10};
const SURFACES=[['driveway','Driveway'],['walkway','Walkway / sidewalk'],['patio','Patio / pool deck'],['fence','Fence'],['house','House exterior (soft wash)'],['roof','Roof soft wash'],['screen','Screen enclosure / pool cage']];
const SIZES=[['Small',1.0],['Medium',1.5],['Large',2.1],['X-large',2.8]];
const CONDS=[['Light',1.0],['Moderate',1.25],['Heavy',1.55]];
const ROOFTYPES=['Tile (barrel/flat)','Shingle','Metal','Flat / low-slope'];
const ADDONS=[['oil','Oil stain pretreat',false],['rust','Rust / fertilizer stain',false],['gutter','Gutter face brightening',false],['seal','Surface sealing (separate quote)',true]];
const PRICE_FIELDS=[['driveway','Driveway $'],['walkway','Walkway $'],['patio','Patio/deck $'],['fence','Fence $'],['house','House $'],['roof','Roof $'],['screen','Screen $'],['oil','Oil add-on $'],['rust','Rust add-on $'],['gutter','Gutter add-on $'],['min','Job minimum $'],['nowater','No-water fee $'],['tile','Tile mult x'],['twostory','2-story mult x'],['tight','Tight mult x']];

const money=n=>'$'+Math.round(n).toLocaleString('en-US');
const digits=s=>String(s||'').replace(/\D/g,'');
const intl=p=>{const d=digits(p);return d.length===10?'1'+d:d;};
const lsGet=(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:v;}catch(e){return d;}};
const lsJSON=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d;}catch(e){return d;}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,typeof v==='string'?v:JSON.stringify(v));}catch(e){}};

/* migrate preset sheet url */
if(localStorage.getItem(LS_URL)===null){lsSet(LS_URL,DEF_SHEET);}

/* ===== pricing engine ===== */
function totalFor(st,P){
  let t=0;
  SURFACES.forEach(([id])=>{
    if(!st.surf[id])return;
    let p=(Number(P[id])||0)*st.size*st.cond;
    if(st.twostory&&(id==='house'||id==='roof'))p*=Number(P.twostory)||1;
    if(id==='roof'&&st.roofType.indexOf('Tile')===0)p*=Number(P.tile)||1;
    t+=p;
  });
  if(st.tight)t*=Number(P.tight)||1;
  ADDONS.forEach(([id,,flag])=>{if(st.addons[id]&&!flag)t+=Number(P[id])||0;});
  if(!st.water)t+=Number(P.nowater)||0;
  const mn=Number(P.min)||0;if(t>0&&t<mn)t=mn;
  return t;
}
const surfList=st=>SURFACES.filter(([id])=>st.surf[id]).map(([,nm])=>nm).join(', ')+(st.commercial?' + Commercial':'');
const addonList=st=>ADDONS.filter(([id])=>st.addons[id]).map(([,nm])=>nm).join(', ');

/* ===== IndexedDB photos ===== */
let _db;
const db=()=>new Promise((res,rej)=>{if(_db)return res(_db);const r=indexedDB.open('soflo_crm',1);r.onupgradeneeded=e=>{e.target.result.createObjectStore('photos',{keyPath:'id',autoIncrement:true}).createIndex('lead','leadId');};r.onsuccess=e=>{_db=e.target.result;res(_db);};r.onerror=()=>rej(r.error);});
const addPhoto=async(leadId,data)=>{const d=await db();return new Promise((res,rej)=>{const t=d.transaction('photos','readwrite');t.objectStore('photos').add({leadId,data,ts:Date.now()});t.oncomplete=res;t.onerror=()=>rej(t.error);});};
const getPhotos=async(leadId)=>{const d=await db();return new Promise(res=>{const r=d.transaction('photos').objectStore('photos').index('lead').getAll(leadId);r.onsuccess=()=>res(r.result||[]);r.onerror=()=>res([]);});};
const rmPhoto=async(id)=>{const d=await db();return new Promise(res=>{const t=d.transaction('photos','readwrite');t.objectStore('photos').delete(id);t.oncomplete=res;});};
const delPhotosFor=async(leadId)=>{const ps=await getPhotos(leadId);for(const p of ps)await rmPhoto(p.id);};
const fileToThumb=file=>new Promise((res,rej)=>{const img=new Image();const u=URL.createObjectURL(file);img.onload=()=>{const m=1200;let w=img.width,h=img.height;if(w>m||h>m){const r=Math.min(m/w,m/h);w=Math.round(w*r);h=Math.round(h*r);}const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',0.72));};img.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('bad'));};img.src=u;});

/* ===== sheets sync ===== */
const sheetUrl=()=>lsGet(LS_URL,'');
const pushLead=l=>{const u=sheetUrl();if(u)fetch(u,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(l)}).catch(()=>{});};
const pushPhoto=(l,data)=>{const u=sheetUrl();if(u)fetch(u,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({type:'photo',leadId:l.id,name:l.name||'',address:l.address||'',photo:data,created:new Date().toISOString()})}).catch(()=>{});};

/* ===== small UI atoms (Tailwind) ===== */
const card="bg-white rounded-2xl border border-line shadow-[0_10px_30px_rgba(24,43,63,.06)] p-5";
const btn="font-display font-extrabold text-sm rounded-xl px-5 py-3 cursor-pointer disabled:opacity-40";
const Btn=({kind='ghost',className='',...p})=>{const k={coral:'bg-coral text-white hover:bg-coraldk',navy:'bg-navy text-white',ghost:'bg-white text-navy border border-line'}[kind];return <button {...p} className={btn+' '+k+' '+className}/>;};
const Lbl=({children})=><label className="block font-display font-extrabold text-[.72rem] tracking-[.09em] uppercase text-navy/60 mb-1">{children}</label>;
const Inp=p=><input {...p} className={"w-full text-base border border-line rounded-xl px-3 min-h-[46px] bg-white "+(p.className||'')}/>;
function Modal({open,onClose,children,wide}){
  const ref=useRef();
  useEffect(()=>{const d=ref.current;if(!d)return;if(open&&!d.open)d.showModal();if(!open&&d.open)d.close();},[open]);
  return <dialog ref={ref} onClose={onClose} className={"rounded-2xl p-0 w-[94%] "+(wide?'max-w-2xl':'max-w-lg')}>
    <div className="p-6">{children}</div></dialog>;
}
function Chip({on,onClick,label,right}){
  return <button onClick={onClick} className={"flex items-center gap-3 min-h-[46px] w-full rounded-xl px-4 py-3 text-left font-display font-bold text-[1.02rem] border-2 "+(on?'border-aquaink bg-aqualt':'border-line bg-white')}>
    <span>{label}</span>{right&&<span className="ml-auto text-aquaink font-extrabold text-sm">{right}</span>}</button>;
}
function Seg({items,value,onPick}){
  return <div className="flex flex-wrap gap-2">{items.map(it=>{const [l,v]=Array.isArray(it)?it:[it,it];const on=value===l;
    return <button key={l} onClick={()=>onPick(v,l)} className={"font-display font-bold text-sm rounded-xl px-4 min-h-[40px] border-[1.5px] "+(on?'bg-navy text-white border-navy':'bg-white text-navy border-line')}>{l}</button>;})}</div>;
}

const blankState=()=>({surf:{},size:1,sizeNm:'Small',cond:1,condNm:'Light',twostory:false,tight:false,water:true,commercial:false,roofType:ROOFTYPES[0],addons:{}});

/* ===== main app ===== */
function App(){
  const [tab,setTab]=useState('new');
  const [leads,setLeads]=useState(()=>lsJSON(LS,[]));
  const [pricing,setPricing]=useState(()=>Object.assign({},DEF_PRICING,lsJSON(LS_PRICE,{})));
  const [st,setSt]=useState(blankState);
  const [cust,setCust]=useState({name:'',phone:'',email:'',address:'',ptype:'Residential',source:'Website quote form',prefDate:'',notes:''});
  const [msg,setMsg]=useState('');
  const [open,setOpen]=useState(null); // 'settings'|'wizard'|{type:'lead',id}|{type:'send',lead,price}|{type:'cust',lead}
  const saveLeads=a=>{setLeads(a);lsSet(LS,a);};
  const total=totalFor(st,pricing);

  const buildLead=()=>({id:Date.now(),created:new Date().toISOString(),...cust,
    surfaces:surfList(st),roofType:st.surf.roof?st.roofType:'',water:st.water,addons:addonList(st),
    size:st.sizeNm,condition:st.condNm,twostory:st.twostory,tight:st.tight,
    estimate:Math.round(total),estLow:Math.round(total*0.9),estHigh:Math.round(total*1.15),
    plan2:Math.round(total*0.85),plan4:Math.round(total*0.75),status:'New'});
  const commit=l=>{const a=[l,...leads];saveLeads(a);pushLead(l);return a.length;};
  const doSave=()=>{if(!cust.name.trim()&&!Object.keys(st.surf).some(k=>st.surf[k])){setMsg('Add a name or pick surfaces first.');return;}
    const n=commit(buildLead());setMsg('Saved. '+n+' lead'+(n>1?'s':'')+' stored.');};

  const pr=id=>Number(pricing[id])||0;
  const toggleSurf=id=>setSt(s=>({...s,surf:{...s.surf,[id]:!s.surf[id]}}));
  const toggleAdd=id=>setSt(s=>({...s,addons:{...s.addons,[id]:!s.addons[id]}}));

  return <div className="font-body">
    <div className="inline-block font-display font-extrabold text-[.68rem] tracking-[.14em] uppercase text-coral bg-white border border-line px-2.5 py-1 rounded-md mb-2">Internal tool · not public</div>
    <h1 className="font-display font-black text-3xl md:text-4xl leading-none">Estimator + leads</h1>

    <div className="flex flex-wrap gap-2 my-5 items-center">
      <button onClick={()=>setTab('new')} className={"font-display font-extrabold text-sm rounded-xl px-5 py-2.5 border-[1.5px] "+(tab==='new'?'bg-navy text-white border-navy':'bg-white border-line')}>New estimate</button>
      <button onClick={()=>setTab('leads')} className={"font-display font-extrabold text-sm rounded-xl px-5 py-2.5 border-[1.5px] "+(tab==='leads'?'bg-navy text-white border-navy':'bg-white border-line')}>Leads {leads.length?'('+leads.length+')':''}</button>
      <button onClick={()=>{setSt(blankState());setCust(c=>({...c,name:'',phone:''}));setOpen('wizard');}} className="font-display font-extrabold text-sm rounded-xl px-5 py-2.5 bg-coral text-white">Door-knock mode</button>
      <button onClick={()=>setOpen('settings')} className="ml-auto text-sm text-navy/60 underline">Settings</button>
    </div>

    {tab==='new'&&<NewEstimate {...{st,setSt,cust,setCust,pricing,pr,toggleSurf,toggleAdd,total,msg,doSave,setMsg}}/>}
    {tab==='leads'&&<Leads {...{leads,saveLeads,setOpen,money}}/>}

    <footer className="text-center text-xs text-navy/55 mt-6">SoFlo UnderPressure internal · data in this browser (localStorage){sheetUrl()?' · Sheet sync on':''} · keep this link private</footer>

    {open==='settings'&&<Settings pricing={pricing} setPricing={setPricing} onClose={()=>setOpen(null)}/>}
    {open==='wizard'&&<Wizard {...{st,setSt,cust,setCust,pricing,pr,total,commit,setOpen}}/>}
    {open&&open.type==='lead'&&<LeadDetail id={open.id} leads={leads} saveLeads={saveLeads} setOpen={setOpen} onClose={()=>setOpen(null)}/>}
    {open&&open.type==='send'&&<SendModal lead={open.lead} price={open.price} onClose={()=>setOpen(null)}/>}
    {open&&open.type==='cust'&&<CustomerModal lead={open.lead} onClose={()=>setOpen(null)} setOpen={setOpen}/>}
  </div>;
}

function NewEstimate({st,setSt,cust,setCust,pricing,pr,toggleSurf,toggleAdd,total,msg,doSave,setMsg}){
  const cv=(k,v)=>setCust(c=>({...c,[k]:v}));
  return <div>
   <div className="grid lg:grid-cols-[1fr_348px] gap-4 items-start">
    <div className="min-w-0 grid gap-4">
      <div className={card}>
        <h2 className="font-display font-extrabold uppercase text-base mb-3">Customer</h2>
        <div className="grid sm:grid-cols-2 gap-3">
          <div><Lbl>Name</Lbl><Inp value={cust.name} onChange={e=>cv('name',e.target.value)} placeholder="First Last"/></div>
          <div><Lbl>Phone</Lbl><Inp type="tel" inputMode="tel" value={cust.phone} onChange={e=>cv('phone',e.target.value)} placeholder="(305) ..."/></div>
          <div><Lbl>Email</Lbl><Inp type="email" value={cust.email} onChange={e=>cv('email',e.target.value)} placeholder="name@email.com"/></div>
          <div><Lbl>Address</Lbl><Inp value={cust.address} onChange={e=>cv('address',e.target.value)} placeholder="Street, city"/></div>
        </div>
        <div className="grid sm:grid-cols-3 gap-3 mt-3">
          <div><Lbl>Property type</Lbl><select value={cust.ptype} onChange={e=>cv('ptype',e.target.value)} className="w-full border border-line rounded-xl px-3 min-h-[46px] bg-white">{['Residential','Commercial','HOA / Property mgr'].map(o=><option key={o}>{o}</option>)}</select></div>
          <div><Lbl>Lead source</Lbl><select value={cust.source} onChange={e=>cv('source',e.target.value)} className="w-full border border-line rounded-xl px-3 min-h-[46px] bg-white">{['Website quote form','Phone call','Referral','Google / GBP','Repeat customer','Walk-up / flyer','Other'].map(o=><option key={o}>{o}</option>)}</select></div>
          <div><Lbl>Preferred date</Lbl><Inp type="date" value={cust.prefDate} onChange={e=>cv('prefDate',e.target.value)}/></div>
        </div>
      </div>
      <div className={card}>
        <h2 className="font-display font-extrabold uppercase text-base mb-3">1. Surfaces</h2>
        <div className="grid sm:grid-cols-2 gap-2.5">{SURFACES.map(([id,nm])=><Chip key={id} on={!!st.surf[id]} onClick={()=>toggleSurf(id)} label={nm} right={'from $'+pr(id)}/>)}</div>
        {st.surf.roof&&<div className="mt-3"><Lbl>Roof type</Lbl><Seg items={ROOFTYPES} value={st.roofType} onPick={(v)=>setSt(s=>({...s,roofType:v}))}/></div>}
        <label className="flex items-center gap-2 mt-3 text-[.95rem]"><input type="checkbox" checked={st.commercial} onChange={e=>setSt(s=>({...s,commercial:e.target.checked}))} className="w-5 h-5 accent-aquaink"/> Commercial storefront (custom, excluded)</label>
      </div>
      <div className={card}>
        <h2 className="font-display font-extrabold uppercase text-base mb-3">2. Size & condition</h2>
        <div className="mb-1"><Lbl>Overall size</Lbl><Seg items={SIZES} value={st.sizeNm} onPick={(v,l)=>setSt(s=>({...s,size:v,sizeNm:l}))}/></div>
        <p className="text-xs text-navy/55 mb-3">Rough bucket, not exact footage.</p>
        <div><Lbl>Growth / condition</Lbl><Seg items={CONDS} value={st.condNm} onPick={(v,l)=>setSt(s=>({...s,cond:v,condNm:l}))}/></div>
      </div>
      <div className={card}>
        <h2 className="font-display font-extrabold uppercase text-base mb-3">3. Access & add-ons</h2>
        {[['twostory','Two-story (adds to house & roof)'],['tight','Tight access / landscaping (+10%)']].map(([k,l])=>
          <label key={k} className="flex items-center gap-2 mb-2 text-[.95rem]"><input type="checkbox" checked={st[k]} onChange={e=>setSt(s=>({...s,[k]:e.target.checked}))} className="w-5 h-5 accent-aquaink"/> {l}</label>)}
        <label className="flex items-center gap-2 mb-3 text-[.95rem]"><input type="checkbox" checked={st.water} onChange={e=>setSt(s=>({...s,water:e.target.checked}))} className="w-5 h-5 accent-aquaink"/> Working water spigot on site</label>
        <div className="grid sm:grid-cols-2 gap-2.5">{ADDONS.map(([id,nm,flag])=><Chip key={id} on={!!st.addons[id]} onClick={()=>toggleAdd(id)} label={nm} right={flag?'+ quote':'+$'+pr(id)}/>)}</div>
      </div>
      <div><Lbl>Job notes</Lbl><textarea value={cust.notes} onChange={e=>cv('notes',e.target.value)} className="w-full border border-line rounded-xl px-3 py-2 min-h-[70px] bg-white" placeholder="Gate code, dog, parking, anything useful..."/></div>
    </div>
    <div className="lg:sticky lg:top-4">
      <div className="bg-navy text-white rounded-2xl p-5">
        <div className="font-display font-extrabold text-[.72rem] tracking-[.14em] uppercase text-aqua">One-off estimate</div>
        <div className="font-display font-black text-5xl leading-none my-1">{money(total)}</div>
        <div className="text-white/70 text-sm">{total>0?'Typical range '+money(total*0.9)+' to '+money(total*1.15)+(st.addons.seal?' · + sealing quote':'')+(!st.water?' · tank job':''):'Pick at least one surface.'}</div>
        {total>0&&<div className="grid grid-cols-3 gap-2 mt-4 pt-4 border-t border-white/15">
          {[['Bragging Rights · 2x',total*0.85,money(total*0.85*2)+'/yr'],['The Show-Off · 4x',total*0.75,money(total*0.75*4)+'/yr'],['Humble Brag · 1x',total,'quote based']].map(([n,v,a])=>
            <div key={n} className="bg-white/[.06] rounded-xl p-2.5"><div className="font-display font-extrabold text-[.66rem] uppercase text-aqua">{n}</div><div className="font-display font-black text-lg">{money(v)}</div><div className="text-white/60 text-[.7rem]">{a}</div></div>)}
        </div>}
      </div>
      <p className="text-xs text-navy/55 mt-3">Estimate only. Confirm on site or from photos before sending a number.</p>
    </div>
   </div>
   <div className="sticky bottom-0 bg-sand py-3 mt-2 border-t border-line flex flex-wrap gap-2 items-center">
     <Btn kind="coral" onClick={doSave}>Save lead</Btn>
     <Btn onClick={()=>{navigator.clipboard.writeText('Surfaces: '+surfList(st)+'\nSize: '+st.sizeNm+' / '+st.condNm+'\nOne-off: '+money(total)+' ('+money(total*0.9)+'-'+money(total*1.15)+')');setMsg('Copied.');}}>Copy estimate</Btn>
     <Btn onClick={()=>{setSt(blankState());setMsg('');}}>Clear</Btn>
     <span className="font-bold text-ok text-sm">{msg}</span>
   </div>
  </div>;
}

function Leads({leads,saveLeads,setOpen}){
  const [q,setQ]=useState('');const [fs,setFs]=useState('');
  const badge={New:'bg-aquaink',Quoted:'bg-[#C58A1A]',Scheduled:'bg-[#5B4FB2]',Won:'bg-ok',Lost:'bg-bad'};
  const by=s=>leads.filter(l=>l.status===s).length;
  const pipe=leads.filter(l=>['New','Quoted','Scheduled'].includes(l.status)).reduce((x,l)=>x+(l.estimate||0),0);
  const won=leads.filter(l=>l.status==='Won').reduce((x,l)=>x+(l.estimate||0),0);
  const rows=leads.filter(l=>(!fs||l.status===fs)&&(!q||[l.name,l.phone,l.address,l.email].join(' ').toLowerCase().includes(q.toLowerCase())));
  const expCSV=()=>{if(!leads.length)return;const cols=['created','name','phone','email','address','ptype','source','prefDate','surfaces','roofType','addons','water','size','condition','twostory','tight','estimate','estLow','estHigh','plan2','plan4','status','notes'];
    const csv=[cols.join(',')].concat(leads.map(l=>cols.map(c=>'"'+String(l[c]==null?'':l[c]).replace(/"/g,'""')+'"').join(','))).join('\n');
    const u=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));const a=document.createElement('a');a.href=u;a.download='soflo-leads-'+new Date().toISOString().slice(0,10)+'.csv';a.click();URL.revokeObjectURL(u);};
  return <div>
    <div className="grid grid-cols-2 md:grid-cols-5 gap-2.5 mb-4">
      {[['Total',leads.length],['New',by('New')],['Scheduled',by('Scheduled')],['Pipeline',money(pipe)],['Won',money(won)]].map(([l,n])=>
        <div key={l} className={card+' !p-3'}><div className="font-display font-black text-2xl">{n}</div><div className="text-[.72rem] uppercase tracking-wide font-bold text-navy/60">{l}</div></div>)}
    </div>
    <div className="flex flex-wrap gap-2 mb-3 items-center">
      <input value={q} onChange={e=>setQ(e.target.value)} placeholder="Search name, phone, address..." className="flex-1 min-w-[160px] border-[1.5px] border-line rounded-lg px-3 py-2 bg-white"/>
      <select value={fs} onChange={e=>setFs(e.target.value)} className="border-[1.5px] border-line rounded-lg px-3 py-2 bg-white"><option value="">All statuses</option>{['New','Quoted','Scheduled','Won','Lost'].map(s=><option key={s}>{s}</option>)}</select>
      <Btn className="!py-2 !text-xs" onClick={expCSV}>Export CSV</Btn>
    </div>
    <div className="overflow-x-auto">
      <table className="w-full bg-white rounded-xl border border-line overflow-hidden text-sm">
        <thead><tr className="bg-sand2 text-left">{['Date','Name','Contact','Job','Est.','Status',''].map((h,i)=><th key={i} className="font-display font-extrabold text-[.68rem] tracking-wide uppercase text-navy/60 px-3 py-2">{h}</th>)}</tr></thead>
        <tbody>{rows.map(l=><tr key={l.id} className="border-t border-line align-top">
          <td className="px-3 py-2">{new Date(l.created).toLocaleDateString()}</td>
          <td className="px-3 py-2"><button className="text-aquaink font-bold underline" onClick={()=>setOpen({type:'lead',id:l.id})}>{l.name||'(no name)'}</button><div className="text-navy/55 text-xs">{l.ptype}</div></td>
          <td className="px-3 py-2">{l.phone}<div className="text-navy/55 text-xs">{l.address}</div></td>
          <td className="px-3 py-2 max-w-[170px]">{l.surfaces}</td>
          <td className="px-3 py-2 font-bold">{money(l.estimate||0)}</td>
          <td className="px-3 py-2"><span className={"font-display font-extrabold text-[.66rem] uppercase px-2 py-0.5 rounded text-white "+(badge[l.status]||'bg-aquaink')}>{l.status}</span></td>
          <td className="px-3 py-2"><button className="text-aquaink font-bold underline" onClick={()=>setOpen({type:'lead',id:l.id})}>Open</button></td>
        </tr>)}</tbody>
      </table>
      {!rows.length&&<div className="text-center text-navy/55 py-10">No leads yet. Save one from the New estimate tab.</div>}
    </div>
  </div>;
}

function LeadDetail({id,leads,saveLeads,setOpen,onClose}){
  const l=leads.find(x=>x.id===id);
  const [notes,setNotes]=useState(l?l.notes||'':'');
  const [status,setStatus]=useState(l?l.status:'New');
  const [photos,setPhotos]=useState([]);
  useEffect(()=>{if(l)getPhotos(l.id).then(setPhotos);},[id]);
  if(!l)return null;
  const save=()=>{const nl={...l,notes,status};const a=leads.map(x=>x.id===id?nl:x);saveLeads(a);lsSet(LS,a);pushLead(nl);onClose();};
  const del=()=>{if(confirm('Delete this lead?')){saveLeads(leads.filter(x=>x.id!==id));delPhotosFor(id);onClose();}};
  const onFiles=async e=>{for(const f of e.target.files){try{const d=await fileToThumb(f);await addPhoto(l.id,d);pushPhoto(l,d);}catch(err){}}setPhotos(await getPhotos(l.id));e.target.value='';};
  const delP=async pid=>{if(confirm('Delete this photo?')){await rmPhoto(pid);setPhotos(await getPhotos(l.id));}};
  const KV=({k,v})=><div className="text-sm text-navy/70 my-1"><b className="text-navy">{k}</b> {v}</div>;
  return <Modal open={true} onClose={onClose}>
    <h3 className="font-display font-black text-2xl">{l.name||'(no name)'}</h3>
    <KV k="Status" v={l.status}/>
    <KV k="Phone" v={(l.phone||'-')+' · '+(l.email||'-')}/>
    <KV k="Address" v={l.address||'-'}/>
    <KV k="Job" v={(l.surfaces||'-')+(l.roofType?' ('+l.roofType+')':'')+' · '+l.size+'/'+l.condition+(l.twostory?' · 2-story':'')+(l.water===false?' · no water':'')}/>
    {l.addons&&<KV k="Add-ons" v={l.addons}/>}
    <KV k="Estimate" v={money(l.estimate)+' ('+money(l.estLow)+'-'+money(l.estHigh)+') · 2x '+money(l.plan2)+' · 4x '+money(l.plan4)}/>
    <div className="my-2"><Lbl>Notes</Lbl><textarea value={notes} onChange={e=>setNotes(e.target.value)} className="w-full border border-line rounded-xl px-3 py-2 min-h-[64px] bg-white"/></div>
    <div className="mb-3"><Lbl>Status</Lbl><select value={status} onChange={e=>setStatus(e.target.value)} className="w-full border border-line rounded-xl px-3 min-h-[44px] bg-white">{['New','Quoted','Scheduled','Won','Lost'].map(s=><option key={s}>{s}</option>)}</select></div>
    <div className="flex gap-2 mb-3"><Btn kind="coral" className="!py-2 !text-xs" onClick={()=>setOpen({type:'send',lead:l})}>Send quote</Btn><Btn kind="navy" className="!py-2 !text-xs" onClick={()=>setOpen({type:'cust',lead:l})}>Customer view</Btn></div>
    <Lbl>Photos</Lbl>
    <div className="flex flex-wrap gap-2 mb-2">{photos.map(p=><img key={p.id} src={p.data} onClick={()=>delP(p.id)} title="Click to delete" className="w-[72px] h-[72px] object-cover rounded-lg border border-line cursor-pointer"/>)}{!photos.length&&<span className="text-sm text-navy/55">No photos yet.</span>}</div>
    <label className={btn+" bg-white text-navy border border-line inline-block cursor-pointer !py-2 !text-xs"}>Add photos<input type="file" accept="image/*" capture="environment" multiple hidden onChange={onFiles}/></label>
    <div className="flex gap-2 mt-4"><Btn kind="navy" className="!py-2 !text-xs" onClick={save}>Save changes</Btn><Btn className="!py-2 !text-xs" onClick={onClose}>Close</Btn><button onClick={del} className="ml-auto text-bad font-display font-extrabold text-xs">Delete</button></div>
  </Modal>;
}

function tmplText(l,price){
  const t=lsGet(LS_TMPL,DEF_TMPL);const range=(l.estLow&&l.estHigh)?money(l.estLow)+' to '+money(l.estHigh):'(estimate pending)';
  return t.replace(/{name}/g,(l.name||'there').split(' ')[0]).replace(/{surfaces}/g,l.surfaces||'your property').replace(/{range}/g,price||range).replace(/{low}/g,money(l.estLow||0)).replace(/{high}/g,money(l.estHigh||0));
}
function SendModal({lead,price,onClose}){
  const [txt,setTxt]=useState(tmplText(lead,price));
  const [note,setNote]=useState('');
  const qrRef=useRef();const [qr,setQr]=useState(false);
  useEffect(()=>{if(qr&&qrRef.current){qrRef.current.innerHTML='';if(window.QRCode)new QRCode(qrRef.current,{text:txt,width:200,height:200,colorDark:'#182B3F',colorLight:'#fff'});}},[qr]);
  const p=digits(lead.phone);
  return <Modal open={true} onClose={onClose}>
    <h3 className="font-display font-black text-2xl">Send quote</h3>
    <p className="text-sm text-navy/70 my-1">{lead.phone?('To '):('No phone on file · ')}<b>{lead.name}</b> {lead.phone&&('· '+lead.phone)}</p>
    <textarea value={txt} onChange={e=>setTxt(e.target.value)} className="w-full border border-line rounded-xl px-3 py-2 min-h-[170px] bg-white my-2"/>
    <div className="flex flex-wrap gap-2">
      <Btn kind="coral" className="!py-2 !text-xs" onClick={()=>{if(!p){setNote('No phone number.');return;}location.href='sms:'+p+'?&body='+encodeURIComponent(txt);}}>Text (SMS)</Btn>
      <Btn kind="navy" className="!py-2 !text-xs" onClick={()=>window.open((intl(lead.phone)?'https://wa.me/'+intl(lead.phone)+'?text=':'https://wa.me/?text=')+encodeURIComponent(txt),'_blank')}>WhatsApp</Btn>
      <Btn className="!py-2 !text-xs" onClick={()=>{navigator.clipboard.writeText(txt).then(()=>{window.open('https://voice.google.com/u/0/messages','_blank');setNote('Text copied. Paste into Google Voice.');});}}>Google Voice</Btn>
      <Btn className="!py-2 !text-xs" onClick={async()=>{if(navigator.share){try{await navigator.share({text:txt});}catch(e){}}else setNote('Share/AirDrop works on phone or Mac Safari. Use Copy here.');}}>Share / AirDrop</Btn>
      <Btn className="!py-2 !text-xs" onClick={()=>setQr(v=>!v)}>QR code</Btn>
      <Btn className="!py-2 !text-xs" onClick={()=>{navigator.clipboard.writeText(txt).then(()=>setNote('Copied.'));}}>Copy</Btn>
    </div>
    {qr&&<div ref={qrRef} className="text-center mt-4"/>}
    <div className="flex gap-2 mt-4"><Btn className="!py-2 !text-xs" onClick={onClose}>Close</Btn></div>
    <p className="text-xs text-navy/55 mt-2">{note}</p>
  </Modal>;
}

function CustomerModal({lead,onClose,setOpen}){
  const range=(lead.estLow&&lead.estHigh)?money(lead.estLow)+' to '+money(lead.estHigh):'(estimate pending)';
  const [price,setPrice]=useState(range);
  const svc=(lead.surfaces||'').split(',').map(s=>s.trim()).filter(Boolean);
  return <Modal open={true} onClose={onClose}>
    <div className="text-center"><div className="font-display font-black text-2xl">SoFlo UnderPressure</div><div className="text-navy/55 text-xs tracking-[.12em] uppercase font-extrabold">Pressure & soft washing · Miami</div></div>
    <h3 className="font-display font-black text-xl mt-4">Estimate for {(lead.name||'you').split(' ')[0]}</h3>
    <ul className="list-disc pl-5 my-2">{(svc.length?svc:['Exterior cleaning']).map((s,i)=><li key={i} className="my-1">{s}</li>)}</ul>
    <div className="bg-aqualt rounded-xl p-4 text-center">
      <div className="text-[.72rem] tracking-wide uppercase font-extrabold text-aquaink">Your price</div>
      <input value={price} onChange={e=>setPrice(e.target.value)} className="text-center font-display font-black text-2xl text-navy bg-white rounded-lg px-2 py-1 mt-1 max-w-[240px] mx-auto block"/>
      <div className="text-xs text-navy/60 mt-1">Flat price, confirmed after a quick look. No hourly, no surprises.</div>
    </div>
    <p className="text-sm text-navy/70 text-center mt-3">Licensed & insured · Owner on every job<br/>(305) 894-6336 · SoFlo.Underpressure@gmail.com</p>
    <div className="flex gap-2 justify-center mt-4"><Btn kind="coral" className="!py-2 !text-xs" onClick={()=>setOpen({type:'send',lead,price})}>Send this to customer</Btn><Btn className="!py-2 !text-xs" onClick={onClose}>Close</Btn></div>
  </Modal>;
}

function Settings({pricing,setPricing,onClose}){
  const [url,setUrl]=useState(lsGet(LS_URL,''));
  const [tmpl,setTmpl]=useState(lsGet(LS_TMPL,DEF_TMPL));
  const [p,setP]=useState({...pricing});
  const [st,setSt]=useState('');
  const savePrice=()=>{const np=Object.assign({},DEF_PRICING,p);Object.keys(np).forEach(k=>np[k]=parseFloat(np[k])||0);setPricing(np);lsSet(LS_PRICE,np);setSt('Pricing saved.');};
  return <Modal open={true} onClose={onClose} wide>
    <h3 className="font-display font-black text-2xl mb-3">Settings</h3>
    <Lbl>Google Sheet sync URL (/exec)</Lbl>
    <Inp value={url} onChange={e=>setUrl(e.target.value)} placeholder="https://script.google.com/.../exec"/>
    <div className="flex gap-2 my-2">
      <Btn kind="navy" className="!py-2 !text-xs" onClick={()=>{lsSet(LS_URL,url.trim());setSt(url.trim()?'Sheet sync on.':'Sync off (browser only).');}}>Save</Btn>
      <Btn className="!py-2 !text-xs" onClick={()=>{if(!url.trim()){setSt('Paste a URL first.');return;}fetch(url.trim(),{method:'POST',mode:'no-cors',body:JSON.stringify({id:Date.now(),name:'TEST ROW',status:'New',created:new Date().toISOString()})}).then(()=>setSt('Sent. Check your Sheet.')).catch(e=>setSt('Error: '+e.message));}}>Send test row</Btn>
    </div>
    <div className="border-t border-line my-4"/>
    <Lbl>Pricing (edit anytime)</Lbl>
    <div className="grid grid-cols-2 sm:grid-cols-3 gap-2">{PRICE_FIELDS.map(([k,l])=>
      <div key={k}><label className="block text-[.66rem] font-display font-extrabold uppercase text-navy/60 mb-0.5">{l}</label>
        <input type="number" step={/tile|twostory|tight/.test(k)?'0.05':'1'} value={p[k]} onChange={e=>setP(s=>({...s,[k]:e.target.value}))} className="w-full border border-line rounded-lg px-2 py-1.5 bg-white"/></div>)}</div>
    <div className="flex gap-2 my-3"><Btn kind="navy" className="!py-2 !text-xs" onClick={savePrice}>Save pricing</Btn><Btn className="!py-2 !text-xs" onClick={()=>{setP({...DEF_PRICING});setPricing({...DEF_PRICING});lsSet(LS_PRICE,DEF_PRICING);}}>Reset default</Btn></div>
    <div className="border-t border-line my-4"/>
    <Lbl>Quote message template</Lbl>
    <textarea value={tmpl} onChange={e=>setTmpl(e.target.value)} className="w-full border border-line rounded-xl px-3 py-2 min-h-[140px] bg-white"/>
    <p className="text-xs text-navy/55 mt-1">Tokens: {'{name} {surfaces} {range} {low} {high}'}. You can still edit each message before sending.</p>
    <div className="flex gap-2 mt-3"><Btn kind="navy" className="!py-2 !text-xs" onClick={()=>{lsSet(LS_TMPL,tmpl);setSt('Template saved.');}}>Save template</Btn><Btn className="!py-2 !text-xs" onClick={()=>{localStorage.removeItem(LS_TMPL);setTmpl(DEF_TMPL);}}>Reset</Btn><Btn className="!py-2 !text-xs ml-auto" onClick={onClose}>Close</Btn></div>
    <p className="text-sm text-ok font-bold mt-2">{st}</p>
  </Modal>;
}

/* ===== wizard ===== */
function Wizard({st,setSt,cust,setCust,pricing,pr,total,commit,setOpen}){
  const steps=['surfaces','roof','size','cond','extras','finish'].filter(s=>s!=='roof'||st.surf.roof);
  const [i,setI]=useState(0);
  const key=steps[Math.min(i,steps.length-1)];
  const ref=useRef();useEffect(()=>{ref.current&&ref.current.showModal();},[]);
  const go=d=>{const ni=i+d;if(ni<0)return;if(ni>=steps.length){finish();return;}setI(ni);};
  const finish=()=>{if(!cust.name.trim()&&!Object.keys(st.surf).some(k=>st.surf[k])){alert('Pick at least one surface.');return;}
    const l={id:Date.now(),created:new Date().toISOString(),...cust,surfaces:surfList(st),roofType:st.surf.roof?st.roofType:'',water:st.water,addons:addonList(st),size:st.sizeNm,condition:st.condNm,twostory:st.twostory,tight:st.tight,estimate:Math.round(total),estLow:Math.round(total*0.9),estHigh:Math.round(total*1.15),plan2:Math.round(total*0.85),plan4:Math.round(total*0.75),status:'New'};
    commit(l);ref.current.close();setOpen({type:'cust',lead:l});};
  const Opt=({on,onClick,label,right})=><button onClick={onClick} className={"flex items-center gap-3 min-h-[58px] w-full rounded-xl px-4 py-3 text-left font-display font-bold text-[1.08rem] border-2 "+(on?'border-aquaink bg-aqualt':'border-line bg-white')}>{label}{right&&<span className="ml-auto text-aquaink font-extrabold text-sm">{right}</span>}</button>;
  return <dialog ref={ref} onClose={()=>setOpen(null)} className="rounded-2xl p-0 w-[94%] max-w-lg"><div className="p-6">
    <div className="flex justify-between items-center mb-3"><div className="font-display font-extrabold text-[.78rem] tracking-wide uppercase text-navy/60">Step {Math.min(i,steps.length-1)+1} of {steps.length}</div><Btn className="!py-2 !text-xs" onClick={()=>ref.current.close()}>Close</Btn></div>
    {key==='surfaces'&&<div><div className="font-display font-black text-2xl mb-3">What are we cleaning?</div><div className="grid gap-2.5">{SURFACES.map(([id,nm])=><Opt key={id} on={!!st.surf[id]} onClick={()=>setSt(s=>({...s,surf:{...s.surf,[id]:!s.surf[id]}}))} label={nm} right={'$'+pr(id)+'+'}/>)}</div></div>}
    {key==='roof'&&<div><div className="font-display font-black text-2xl mb-3">Roof type?</div><div className="grid gap-2.5">{ROOFTYPES.map(rt=><Opt key={rt} on={st.roofType===rt} onClick={()=>{setSt(s=>({...s,roofType:rt}));go(1);}} label={rt}/>)}</div></div>}
    {key==='size'&&<div><div className="font-display font-black text-2xl mb-3">How big?</div><div className="grid gap-2.5">{SIZES.map(([l,v])=><Opt key={l} on={st.sizeNm===l} onClick={()=>{setSt(s=>({...s,size:v,sizeNm:l}));go(1);}} label={l}/>)}</div></div>}
    {key==='cond'&&<div><div className="font-display font-black text-2xl mb-3">How dirty?</div><div className="grid gap-2.5">{CONDS.map(([l,v])=><Opt key={l} on={st.condNm===l} onClick={()=>{setSt(s=>({...s,cond:v,condNm:l}));go(1);}} label={l}/>)}</div></div>}
    {key==='extras'&&<div><div className="font-display font-black text-2xl mb-3">Anything else?</div><div className="grid gap-2.5">
      <Opt on={st.twostory} onClick={()=>setSt(s=>({...s,twostory:!s.twostory}))} label="Two-story"/>
      <Opt on={!st.water} onClick={()=>setSt(s=>({...s,water:!s.water}))} label="No water on site (tank)"/>
      <Opt on={st.tight} onClick={()=>setSt(s=>({...s,tight:!s.tight}))} label="Tight access / landscaping"/>
      {ADDONS.map(([id,nm,flag])=><Opt key={id} on={!!st.addons[id]} onClick={()=>setSt(s=>({...s,addons:{...s.addons,[id]:!s.addons[id]}}))} label={nm} right={flag?'+quote':'+$'+pr(id)}/>)}
    </div></div>}
    {key==='finish'&&<div><div className="font-display font-black text-2xl mb-3">Who's it for?</div>
      <div className="mb-2"><Lbl>Name</Lbl><Inp value={cust.name} onChange={e=>setCust(c=>({...c,name:e.target.value}))}/></div>
      <div className="mb-3"><Lbl>Phone</Lbl><Inp type="tel" inputMode="tel" value={cust.phone} onChange={e=>setCust(c=>({...c,phone:e.target.value}))}/></div>
      <div className="bg-aqualt rounded-xl p-4 text-center"><div className="text-[.72rem] uppercase font-extrabold text-aquaink">Estimate</div><div className="font-display font-black text-4xl">{money(total)}</div><div className="text-xs text-navy/60">Range {money(total*0.9)} to {money(total*1.15)}</div></div></div>}
    <div className="flex gap-2 mt-4">{i>0&&<Btn className="!py-2.5" onClick={()=>go(-1)}>Back</Btn>}<Btn kind="coral" className="ml-auto min-h-[52px] px-6" onClick={()=>key==='finish'?finish():go(1)}>{key==='finish'?'Save lead':'Next'}</Btn></div>
  </div></dialog>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
